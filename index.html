<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TetraShop - پروژه</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 50px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { color: #2d3748; font-size: 2.5rem; }
        p { color: #4a5568; font-size: 1.2rem; }
        .badge { display: inline-block; background: #48bb78; color: white; padding: 8px 20px; border-radius: 50px; font-size: 0.9rem; }
        .footer { margin-top: 40px; color: #a0aec0; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 $repo</h1>
        <p>این پروژه با موفقیت روی Vercel دیپلوی شده است.</p>
        <div class="badge">✅ فعال و در دسترس</div>
        <div class="footer">پلتفرم TetraShop • ${date}</div>
    </div>
</body>
</html>
